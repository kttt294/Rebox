name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate public build variables
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/zesyc/reboxe-api:${{ env.IMAGE_TAG }}
            ghcr.io/zesyc/reboxe-api:latest
          cache-from: type=gha,scope=reboxe

      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/zesyc/reboxe-worker:${{ env.IMAGE_TAG }}
            ghcr.io/zesyc/reboxe-worker:latest
          cache-from: type=gha,scope=reboxe

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/zesyc/reboxe-web:${{ env.IMAGE_TAG }}
            ghcr.io/zesyc/reboxe-web:latest
          cache-from: type=gha,scope=reboxe
          cache-to: type=gha,mode=max,scope=reboxe

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare SSH target
        env:
          VPS_HOST_RAW: ${{ secrets.VPS_HOST }}
          VPS_USER_RAW: ${{ secrets.VPS_USER }}
        run: bash .github/scripts/prepare-ssh-target.sh

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production Compose file
        run: scp compose.production.yaml "$VPS_USER@$VPS_HOST:/opt/reboxe/compose.production.yaml"

      - name: Log VPS in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull, migrate, and restart
        run: |
          ssh "$VPS_USER@$VPS_HOST" "cd /opt/reboxe && \
            IMAGE_TAG='$IMAGE_TAG' docker compose -f compose.production.yaml --env-file .env.production pull && \
            IMAGE_TAG='$IMAGE_TAG' docker compose -f compose.production.yaml --env-file .env.production run --rm --no-deps api node ../../packages/backend/dist/platform/database/migrate.js && \
            IMAGE_TAG='$IMAGE_TAG' docker compose -f compose.production.yaml --env-file .env.production up -d --remove-orphans"

      - name: Verify production health
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 https://api.reboxe.id.vn/health/ready
