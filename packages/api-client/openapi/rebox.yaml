openapi: 3.1.0
info:
  title: REBOX API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3001
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me:
    get:
      operationId: getActorContext
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current actor and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorContext"
  /v1/shops:
    post:
      operationId: createShop
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, legalType]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 120 }
                legalType: { type: string, enum: [INDIVIDUAL, HOUSEHOLD, ENTERPRISE] }
      responses:
        "201":
          description: Shop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopAccess"
  /v1/shops/{shopId}/listings:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    get:
      operationId: listShopListings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Shop listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
    post:
      operationId: createListingDraft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListing"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /v1/shops/{shopId}/listings/{listingId}/publish:
    post:
      operationId: publishListing
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "201":
          description: Listing published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /v1/shops/{shopId}/listings/{listingId}:
    patch:
      operationId: updateListingDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingDraft"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /v1/listings/{listingId}:
    get:
      operationId: getPublicListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Public listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListing"
  /v1/listings:
    get:
      operationId: listPublicListings
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: q
          in: query
          schema: { type: string, maxLength: 180 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: shopId
          in: query
          schema: { type: string, maxLength: 80 }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc], default: newest }
      responses:
        "200":
          description: Public listings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingPage"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ShopId:
      name: shopId
      in: path
      required: true
      schema: { type: string }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    ShopAccess:
      type: object
      required: [shopId, displayName, role, kycStatus, shopStatus]
      properties:
        shopId: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [OWNER, MANAGER, WAREHOUSE, ACCOUNTING] }
        kycStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        shopStatus: { type: string, enum: [ONBOARDING, ACTIVE, PAUSED, LOCKED_INSUFFICIENT_FUND, SUSPENDED] }
    ActorContext:
      type: object
      required: [id, profileStatus, shops]
      properties:
        id: { type: string, format: uuid }
        profileStatus: { anyOf: [{ type: string, enum: [ACTIVE, SUSPENDED, DELETED] }, { type: "null" }] }
        shops:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ShopAccess"
              - type: object
                required: [id, membershipStatus, status]
                properties:
                  id: { type: string }
                  membershipStatus: { type: string }
                  status: { type: string }
    CreateListing:
      type: object
      required: [title, categoryId, conditionGrade, conditionNotes, price, weightGram]
      properties:
        title: { type: string, minLength: 3, maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: string }
        conditionGrade: { type: string, enum: [NEW_SEALED, LIKE_NEW_99, GOOD, FAIR, DEFECT] }
        conditionNotes: { type: string, minLength: 3, maxLength: 2000 }
        price: { type: integer, minimum: 1 }
        weightGram: { type: integer, minimum: 1, maximum: 100000 }
    UpdateListingDraft:
      $ref: "#/components/schemas/CreateListing"
      unevaluatedProperties: false
    Listing:
      allOf:
        - $ref: "#/components/schemas/CreateListing"
        - type: object
          required: [id, shopId, shopDisplayName, images, status, publishedAt, createdAt]
          properties:
            id: { type: string }
            shopId: { type: string }
            shopDisplayName: { type: string }
            images: { type: array, items: { type: object } }
            status: { type: string }
            publishedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
            createdAt: { type: string, format: date-time }
    PublicListing:
      type: object
      required: [id, shopId, shopDisplayName, title, categoryId, conditionGrade, conditionNotes, price, publishedAt, createdAt]
      properties:
        id: { type: string }
        shopId: { type: string }
        shopDisplayName: { type: string }
        title: { type: string, minLength: 3, maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: string }
        conditionGrade: { type: string, enum: [NEW_SEALED, LIKE_NEW_99, GOOD, FAIR, DEFECT] }
        conditionNotes: { type: string, minLength: 3, maxLength: 2000 }
        price: { type: integer, minimum: 1 }
        publishedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
    PublicListingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicListing" }
        nextCursor: { anyOf: [{ type: string }, { type: "null" }] }
