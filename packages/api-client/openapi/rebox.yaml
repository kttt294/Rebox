openapi: 3.1.0
info:
  title: REBOX API
  version: 1.4.0
servers:
  - url: http://127.0.0.1:3001
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me:
    get:
      operationId: getActorContext
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current actor and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorContext"
  /v1/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Active categories available to the seller picker
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /v1/seller-onboarding/uploads:
    post:
      operationId: createSellerDocumentUploadIntent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSellerDocumentUpload"
      responses:
        "201":
          description: Signed upload intent for an avatar or private KYC document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImageUploadIntent"
  /v1/kyc/start:
    post:
      operationId: startKyc
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shopId]
              properties:
                shopId: { type: string }
      responses:
        "201":
          description: Idempotently starts KYC for an owned shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStartResult" }
  /v1/kyc/document/front:
    post:
      operationId: submitKycDocumentFront
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/KycImage" }
      responses:
        "201":
          description: Normalized front-side OCR and document validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/document/back:
    post:
      operationId: submitKycDocumentBack
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/KycImage" }
      responses:
        "201":
          description: Normalized back-side OCR and document validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/selfie:
    post:
      operationId: submitKycSelfie
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/KycImage" }
      responses:
        "201":
          description: Normalized face-match and liveness result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/tax:
    post:
      operationId: submitKycTax
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kycId, taxCode]
              properties:
                kycId: { type: string }
                taxCode: { type: string, pattern: '^\d{10}(-\d{3})?$' }
      responses:
        "201":
          description: Tax verification recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/bank:
    post:
      operationId: submitKycBank
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kycId, bankCode, accountNumber]
              properties:
                kycId: { type: string }
                bankCode: { type: string, minLength: 2, maxLength: 30 }
                accountNumber: { type: string, pattern: '^\d{6,30}$' }
      responses:
        "201":
          description: Bank account verified and authoritative holder name compared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/{kycId}/status:
    get:
      operationId: getKycStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kycId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current normalized KYC status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/admin/kyc:
    get:
      operationId: listKycReviews
      description: Requires database staff role MODERATOR or SUPER_ADMIN, ACTIVE profile/role, and verified JWT aal2.
      security:
      - {bearerAuth: []}
      parameters:
      - name: status
        in: query
        schema: {type: string, enum: [MANUAL_REVIEW], default: MANUAL_REVIEW}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 200}
        description: Opaque nextCursor from the previous page.
      responses:
        '200':
          description: Authorized KYC review response
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKycQueue'}
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Active moderator/super admin and AAL2 required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: KYC not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid query, body or key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/admin/kyc/{kycId}:
    get:
      operationId: getKycReview
      description: Requires database staff role MODERATOR or SUPER_ADMIN, ACTIVE profile/role, and verified JWT aal2.
      security:
      - {bearerAuth: []}
      parameters:
      - name: kycId
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Authorized KYC review response
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKycDetail'}
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Active moderator/super admin and AAL2 required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: KYC not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid query, body or key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/admin/kyc/{kycId}/decision:
    post:
      operationId: decideKycReview
      description: Requires database staff role MODERATOR or SUPER_ADMIN, ACTIVE profile/role, and verified JWT aal2.
      security:
      - {bearerAuth: []}
      parameters:
      - name: kycId
        in: path
        required: true
        schema: {type: string}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authorized KYC review response
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KycDecisionResult'}
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Active moderator/super admin and AAL2 required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: KYC not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid query, body or key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Already decided or idempotency key reused with a different payload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KycDecision'}
  /v1/shops:
    post:
      operationId: createShop
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, legalType, description, phone, pickupAddress, kyc, documents, carrierCodes]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 120 }
                legalType: { type: string, enum: [INDIVIDUAL, HOUSEHOLD, ENTERPRISE] }
                description: { type: string, minLength: 10, maxLength: 500 }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                pickupAddress:
                  type: object
                  additionalProperties: false
                  required: [contactName, addressLine, province, district, ward]
                  properties:
                    contactName: { type: string, minLength: 2, maxLength: 120 }
                    addressLine: { type: string, minLength: 5, maxLength: 250 }
                    province: { type: string, minLength: 2, maxLength: 100 }
                    district: { type: string, minLength: 2, maxLength: 100 }
                    ward: { type: string, minLength: 2, maxLength: 100 }
                kyc:
                  type: object
                  additionalProperties: false
                  required: [taxCode, bankCode, bankAccount, accountHolder]
                  properties:
                    taxCode: { type: string, minLength: 5, maxLength: 30 }
                    bankCode: { type: string, minLength: 2, maxLength: 30 }
                    bankAccount: { type: string, minLength: 6, maxLength: 30 }
                    accountHolder: { type: string, minLength: 2, maxLength: 120 }
                documents:
                  type: object
                  additionalProperties: false
                  required: [avatarKey, cccdFrontKey, cccdBackKey]
                  properties:
                    avatarKey: { type: string, minLength: 1, maxLength: 500 }
                    cccdFrontKey: { type: string, minLength: 1, maxLength: 500 }
                    cccdBackKey: { type: string, minLength: 1, maxLength: 500 }
                carrierCodes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: string, enum: [GHN, GHTK] }
      responses:
        "201":
          description: Shop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopAccess"
  /v1/shops/{shopId}/listings:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    get:
      operationId: listShopListings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Shop listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
    post:
      operationId: createListingDraft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListing"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /v1/shops/{shopId}/return-imports/preview:
    post:
      operationId: previewReturnManifest
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Parsed and allowlisted return manifest preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnManifestPreview"
  /v1/shops/{shopId}/return-imports/{batchId}/commit:
    post:
      operationId: commitReturnManifest
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "201":
          description: Idempotently committed return packages and source lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitReturnManifestResult"
  /v1/shops/{shopId}/listings/{listingId}/publish:
    post:
      operationId: publishListing
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "201":
          description: Policy evaluated; listing activated or sent to manual review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishListingResult"
  /v1/shops/{shopId}/listings/{listingId}/images/init:
    post:
      operationId: createCatalogImageUploadIntent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogImageUpload"
      responses:
        "201":
          description: Signed catalog image upload intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImageUploadIntent"
  /v1/shops/{shopId}/listings/{listingId}/images/complete:
    post:
      operationId: completeCatalogImageUpload
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Uploaded image metadata verified and attached to the draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /v1/shops/{shopId}/listings/{listingId}:
    patch:
      operationId: updateListingDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingDraft"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /v1/listings/{listingId}:
    get:
      operationId: getPublicListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Public listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListing"
  /v1/listings:
    get:
      operationId: listPublicListings
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: q
          in: query
          schema: { type: string, maxLength: 180 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: shopId
          in: query
          schema: { type: string, maxLength: 80 }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc], default: newest }
      responses:
        "200":
          description: Public listings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingPage"
components:
  requestBodies:
    KycImage:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [kycId, objectKey]
            properties:
              kycId: { type: string }
              objectKey: { type: string, minLength: 1, maxLength: 500 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ShopId:
      name: shopId
      in: path
      required: true
      schema: { type: string }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    ShopAccess:
      type: object
      required: [shopId, displayName, role, kycStatus, shopStatus]
      properties:
        shopId: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [OWNER, MANAGER, WAREHOUSE, ACCOUNTING] }
        kycStatus: { type: string, enum: [PENDING, PROCESSING, VERIFIED, REJECTED, MANUAL_REVIEW] }
        shopStatus: { type: string, enum: [ONBOARDING, ACTIVE, PAUSED, LOCKED_INSUFFICIENT_FUND, SUSPENDED] }
    ActorContext:
      type: object
      additionalProperties: false
      required: [id, profileStatus, shops]
      properties:
        id: {type: string, format: uuid}
        profileStatus:
          anyOf:
          - {type: string, enum: [ACTIVE, SUSPENDED, DELETED]}
          - {type: 'null'}
        shops:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, displayName, role, membershipStatus, kycId, kycStatus, status]
            properties:
              id: {type: string}
              displayName: {type: string}
              role: {type: string, enum: [OWNER, MANAGER, WAREHOUSE, ACCOUNTING]}
              membershipStatus: {type: string}
              kycId: {type: [string, 'null']}
              kycStatus: {type: string, enum: [PENDING, PROCESSING, VERIFIED, REJECTED, MANUAL_REVIEW]}
              status: {type: string, enum: [ONBOARDING, ACTIVE, PAUSED, LOCKED_INSUFFICIENT_FUND, SUSPENDED]}
    CreateListing:
      type: object
      required: [title, categoryId, conditionGrade, conditionNotes, price, weightGram]
      properties:
        title: { type: string, minLength: 3, maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: string }
        conditionGrade: { type: string, enum: [NEW_SEALED, LIKE_NEW_99, GOOD, FAIR, DEFECT] }
        conditionNotes: { type: string, minLength: 3, maxLength: 2000 }
        price: { type: integer, minimum: 1 }
        weightGram: { type: integer, minimum: 1, maximum: 100000 }
    UpdateListingDraft:
      $ref: "#/components/schemas/CreateListing"
      unevaluatedProperties: false
    CreateCatalogImageUpload:
      type: object
      additionalProperties: false
      required: [mimeType, sizeBytes]
      properties:
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
    CreateSellerDocumentUpload:
      type: object
      additionalProperties: false
      required: [kind, mimeType, sizeBytes]
      properties:
        kind: { type: string, enum: [AVATAR, CCCD_FRONT, CCCD_BACK, SELFIE] }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
    CatalogImageUploadIntent:
      type: object
      required: [key, uploadUrl, expiresAt, headers]
      properties:
        key: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        headers:
          type: object
          additionalProperties: { type: string }
    KycStartResult:
      allOf:
        - $ref: "#/components/schemas/KycStatus"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    KycReview:
      type: object
      additionalProperties: false
      required: [reason, reviewedAt]
      properties:
        reason: {type: string}
        reviewedAt: {type: string, format: date-time}
    KycIdentity:
      type: object
      additionalProperties: false
      required: [citizenId, fullName, dateOfBirth, gender, address, issuedAt]
      properties:
        citizenId: {type: [string, 'null'], description: Masked identifier; only the last four digits are shown.}
        fullName: {type: [string, 'null']}
        dateOfBirth: {type: [string, 'null']}
        gender: {type: [string, 'null']}
        address: {type: [string, 'null']}
        issuedAt: {type: [string, 'null']}
    KycVerification:
      type: object
      additionalProperties: false
      required: [documentValid, faceMatched, faceScore, livenessPassed, livenessScore]
      properties:
        documentValid: {type: [boolean, 'null']}
        faceMatched: {type: [boolean, 'null']}
        faceScore: {type: [number, 'null']}
        livenessPassed: {type: [boolean, 'null']}
        livenessScore: {type: [number, 'null']}
    AdminKycQueueItem:
      type: object
      additionalProperties: false
      required: [kycId, shopId, shopDisplayName, status, provider, submittedAt]
      properties:
        kycId: {type: string}
        shopId: {type: string}
        shopDisplayName: {type: string}
        status: {type: string, const: MANUAL_REVIEW}
        provider: {type: string}
        submittedAt: {type: string, format: date-time}
    AdminKycQueue:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminKycQueueItem'}
        nextCursor: {type: [string, 'null']}
    KycDecision:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Trimmed non-empty reason visible to seller.}
    KycDecisionResult:
      type: object
      additionalProperties: false
      required: [kycId, kycStatus, review]
      properties:
        kycId: {type: string}
        kycStatus: {type: string, enum: [VERIFIED, REJECTED]}
        review: {$ref: '#/components/schemas/KycReview'}
    AdminKycDetail:
      type: object
      additionalProperties: false
      required: [kycId, shopId, shopDisplayName, status, provider, submittedAt, identity, verification, review, tax, bank]
      properties:
        kycId: {type: string}
        shopId: {type: string}
        shopDisplayName: {type: string}
        status: {type: string, enum: [PENDING, PROCESSING, VERIFIED, REJECTED, MANUAL_REVIEW]}
        provider: {type: string}
        submittedAt: {type: string, format: date-time}
        identity: {$ref: '#/components/schemas/KycIdentity'}
        verification: {$ref: '#/components/schemas/KycVerification'}
        review:
          anyOf:
          - {$ref: '#/components/schemas/KycReview'}
          - {type: 'null'}
        tax:
          type: object
          additionalProperties: false
          required: [status, registeredName]
          properties:
            status:
              anyOf:
              - {type: string, enum: [VERIFIED, NOT_FOUND, UNAVAILABLE]}
              - {type: 'null'}
            registeredName: {type: [string, 'null']}
        bank:
          type: object
          additionalProperties: false
          required: [bankCode, accountNumber, status, registeredName, nameMatchScore]
          properties:
            bankCode: {type: [string, 'null']}
            accountNumber: {type: [string, 'null'], description: Masked account number.}
            status:
              anyOf:
              - {type: string, enum: [VERIFIED, NOT_FOUND, UNAVAILABLE]}
              - {type: 'null'}
            registeredName: {type: [string, 'null']}
            nameMatchScore: {type: [number, 'null']}
    KycStatus:
      type: object
      additionalProperties: false
      required: [success, kycStatus, review, identity, verification]
      properties:
        success: {type: boolean}
        kycStatus: {type: string, enum: [PENDING, PROCESSING, VERIFIED, REJECTED, MANUAL_REVIEW]}
        review:
          anyOf:
          - {$ref: '#/components/schemas/KycReview'}
          - {type: 'null'}
        identity: {$ref: '#/components/schemas/KycIdentity'}
        verification: {$ref: '#/components/schemas/KycVerification'}
    ListingImage:
      type: object
      additionalProperties: false
      required: [key, url, width, height]
      properties:
        key: { type: string }
        url: { type: string, format: uri }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    Listing:
      allOf:
        - $ref: "#/components/schemas/CreateListing"
        - type: object
          required: [id, shopId, shopDisplayName, images, status, publishedAt, createdAt]
          properties:
            id: { type: string }
            shopId: { type: string }
            shopDisplayName: { type: string }
            images:
              type: array
              maxItems: 6
              items: { $ref: "#/components/schemas/ListingImage" }
            status: { type: string, enum: [DRAFT, PENDING_REVIEW, ACTIVE, HIDDEN_BY_FUND, RESERVED, SOLD, RELISTABLE, SUSPENDED, DELISTED] }
            publishedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
            createdAt: { type: string, format: date-time }
    ListingPolicyResult:
      type: object
      additionalProperties: false
      required: [outcome, policyLevel, policyVersion, message]
      properties:
        outcome: { type: string, enum: [ACTIVE, PENDING_REVIEW] }
        policyLevel: { anyOf: [{ type: string, enum: [BANNED, MANUAL_REVIEW, DISCLOSURE] }, { type: "null" }] }
        policyVersion: { anyOf: [{ type: string }, { type: "null" }] }
        message: { type: string }
    PublishListingResult:
      type: object
      additionalProperties: false
      required: [listing, policy]
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        policy: { $ref: "#/components/schemas/ListingPolicyResult" }
    ReturnManifestLineDraft:
      type: object
      additionalProperties: false
      required: [sourceItemRef, sourceQuantity, productName, productImageUrls, reboxCategoryId]
      properties:
        sourceItemRef: { type: string }
        sourceSku: { type: string }
        sourceQuantity: { type: integer, minimum: 1 }
        productName: { type: string }
        variantName: { type: string }
        brand: { type: string }
        sourceCategory: { type: string }
        originalUnitPriceVnd: { type: integer, minimum: 1 }
        returnReason: { type: string }
        productImageUrls:
          type: array
          items: { type: string, format: uri }
        reboxCategoryId: { type: string }
    ReturnManifestDraft:
      type: object
      additionalProperties: false
      required: [source, sourcePlatform, sourceTrackingNo, packageListingPriceVnd, lines]
      properties:
        source: { type: string, enum: [SPREADSHEET, PLATFORM_API] }
        sourcePlatform: { type: string, enum: [SHOPEE, TIKTOK] }
        sourceTrackingNo: { type: string }
        sourceOrderRef: { type: string }
        sourceReturnRef: { type: string }
        returnedAt: { type: string, format: date-time }
        packageWeightGram: { type: integer, minimum: 1, maximum: 100000 }
        packageDimensionsCm:
          type: object
          additionalProperties: false
          required: [length, width, height]
          properties:
            length: { type: number, exclusiveMinimum: 0 }
            width: { type: number, exclusiveMinimum: 0 }
            height: { type: number, exclusiveMinimum: 0 }
        packageListingPriceVnd: { type: integer, minimum: 1 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReturnManifestLineDraft" }
    ReturnManifestIssueCode:
      type: string
      enum: [INVALID_FIELD, INVALID_CATEGORY, PACKAGE_FIELD_CONFLICT, DUPLICATE_SOURCE_ITEM_REF]
    ReturnManifestPreviewRow:
      type: object
      additionalProperties: false
      required: [rowIndex, packageGroup, warningCodes, errorCodes]
      properties:
        rowIndex: { type: integer, minimum: 1 }
        packageGroup: { type: string }
        warningCodes:
          type: array
          items: { $ref: "#/components/schemas/ReturnManifestIssueCode" }
        errorCodes:
          type: array
          items: { $ref: "#/components/schemas/ReturnManifestIssueCode" }
    ReturnManifestPreview:
      type: object
      additionalProperties: false
      required: [batchId, rows, drafts, canCommit]
      properties:
        batchId: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ReturnManifestPreviewRow" }
        drafts:
          type: array
          items: { $ref: "#/components/schemas/ReturnManifestDraft" }
        canCommit: { type: boolean }
    CommitReturnManifestResult:
      type: object
      additionalProperties: false
      required: [batchId, packageIds, lineCount]
      properties:
        batchId: { type: string }
        packageIds:
          type: array
          items: { type: string }
        lineCount: { type: integer, minimum: 0 }
    PublicListing:
      type: object
      required: [id, shopId, shopDisplayName, title, categoryId, conditionGrade, conditionNotes, price, images, publishedAt, createdAt]
      properties:
        id: { type: string }
        shopId: { type: string }
        shopDisplayName: { type: string }
        title: { type: string, minLength: 3, maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: string }
        conditionGrade: { type: string, enum: [NEW_SEALED, LIKE_NEW_99, GOOD, FAIR, DEFECT] }
        conditionNotes: { type: string, minLength: 3, maxLength: 2000 }
        price: { type: integer, minimum: 1 }
        images:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/ListingImage" }
        publishedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
    PublicListingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicListing" }
        nextCursor: { anyOf: [{ type: string }, { type: "null" }] }
